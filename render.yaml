# Render Blueprint for the Grok → Claude Code bridge (grok-bridge/).
# This only creates the bridge service; the website itself stays on Vercel.
services:
  - type: web
    name: grok-claude-bridge
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./grok-bridge/Dockerfile
    dockerContext: ./grok-bridge
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - grok-bridge/**
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: BRIDGE_TOKEN
        generateValue: true
      - key: GITHUB_REPO
        value: uniquesalesinc-hub/wholesaleuspeptides
      - key: BASE_BRANCH
        value: main
      - key: WORK_BRANCH
        value: grok-changes
      - key: MAX_BUDGET_USD
        value: "3"
